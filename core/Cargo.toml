[package]
name = "testapp-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
anyhow = "1.0.102"
thiserror = "1.0"
uniffi = { version = "0.31.1", features = ["wasm-unstable-single-threaded"] }
[target.'cfg(not(target_os = "android"))'.dependencies]
xybrid-core = { version = "0.1.0-rc3" }
xybrid-sdk = { version = "0.1.0-rc3" }

[target.'cfg(target_os = "android")'.dependencies]
xybrid-core = { version = "0.1.0-rc3", default-features = false, features = ["ort-dynamic", "llm-llamacpp"] }
xybrid-sdk = { version = "0.1.0-rc3", default-features = false, features = ["platform-android"] }
# Android ndk-context support (auto-added by JFFI)
ndk-context = "0.1"
jni = "0.21"
