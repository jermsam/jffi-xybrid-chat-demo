[package]
name = "testapp"
version = "1.2.3"
# Increment version_code for every store upload
version_code = 42

[platforms]
enabled = ["android"]

[platforms.ios]
deployment_target = "16.0"
# IMPORTANT: Must match your Apple Developer provisioning profile
bundle_id = "com.yourcompany.testapp"

[platforms.android]
min_sdk = 28
target_sdk = 34
# IMPORTANT: Must be unique on Google Play — cannot be com.example.*
package = "com.yourcompany.testapp"
abis = ["arm64-v8a"]
rustflags = "-C link-arg=-Wl,-z,max-page-size=16384 -C target-feature=+fp16"

[platforms.macos]
deployment_target = "13.0"

[platforms.windows]
min_version = "10.0.19041.0"

[platforms.linux]
gtk_version = "4.0"

[platforms.web]
target = "es2020"
